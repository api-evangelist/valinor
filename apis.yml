aid: valinor
name: Valinor
description: >-
  Valinor Enterprises is a defense and government technology operational
  holding company — a "company of companies" that builds and buys
  mission-critical technologies to fill the gaps others ignore. It centralizes
  go-to-market, compliance, security, and operations while decentralizing
  engineering across lean Product Companies including Condor (attritable
  aerial systems), Dispatch (drone charging infrastructure, selected by DIU
  for the CADDS program), Harbor (expeditionary medical systems for the Marine
  Corps), Reflex (smart optics with onboard vision models), and Streamline
  (AI-enabled data collection with structured ontology write-back). Backed by
  General Catalyst; raised a $54M Series A led by Friends & Family Capital.
  Valinor publishes no public API or developer portal; its developer footprint
  is a GitHub organization and the @valinor-enterprises npm scope.
